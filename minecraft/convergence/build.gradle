plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    ['riftbound', 'copperwake', 'starfall'].each { sibling ->
        if (project.findProject(":${sibling}") != null) {
            implementation project(path: ":${sibling}", configuration: 'namedElements')
        } else if (project.hasProperty('packModsDir')) {
            modRuntimeOnly fileTree(project.packModsDir) { include "${sibling}-*.jar"; exclude '*-sources.jar' }
        }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'convergence_test'
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}
tasks.register('domainTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.afuerta.convergence.domain.DomainTests'
    enableAssertions = true
}
tasks.register('validateResources', Exec) { commandLine 'python3', 'tools/validate_resources.py' }
check.dependsOn domainTest, validateResources
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
