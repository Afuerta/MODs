pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'fabric-loom' version '1.10.5'
    }
}

rootProject.name = 'convergence-pack'
include 'riftbound', 'copperwake', 'starfall', 'convergence'
