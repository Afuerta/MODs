name: Riftbound build
on:
  push:
    paths: ['minecraft/riftbound/**', '.github/workflows/riftbound.yml']
  pull_request:
    paths: ['minecraft/riftbound/**', '.github/workflows/riftbound.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/riftbound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate resources
        run: python3 tools/validate_resources.py
      - name: Compile, check domain behavior, and package
        run: bash ./gradlew --no-daemon --console=plain runGameTest build
      - uses: actions/upload-artifact@v4
        with:
          name: riftbound-build
          path: minecraft/riftbound/build/libs/*.jar
          if-no-files-found: error
